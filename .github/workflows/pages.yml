name: Deploy leaderboard

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    outputs:
      artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site and shared homepage data
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        shell: bash
        run: |
          : "${ARTIFACT_ID:?Missing Pages artifact ID}"
          for attempt in {1..12}; do
            if ready_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq 'select(.expired == false) | .id' 2>/dev/null) && [[ "$ready_id" == "$ARTIFACT_ID" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact $ARTIFACT_ID did not become available."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
